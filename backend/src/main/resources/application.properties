spring.application.name=practicantes
server.port=8080

# --- Base de datos local (SQLite). Las rutas son relativas a la carpeta backend/ ---
spring.datasource.url=jdbc:sqlite:${APP_DATA_DIR:../data}/practicantes.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite admite un solo escritor a la vez; un pool de 1 evita errores "database is locked".
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Archivos ---
app.uploads.dir=${APP_UPLOADS_DIR:../uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Permite responder 413 con JSON en lugar de cortar la conexión cuando el archivo es grande.
server.tomcat.max-swallow-size=-1

# --- Analista de prueba (contraseña guardada como hash BCrypt) ---
# Credenciales de demo: analista / Analista2026*  (en un entorno real se inyectan por variables de entorno)
app.analista.usuario=${APP_ANALISTA_USUARIO:analista}
app.analista.password-hash=${APP_ANALISTA_PASSWORD_HASH:$2a$10$/.N/DBots2rYSUuk.isSy.qI6RtMiGp2Or67n51eaNraBFyHJw9dC}

spring.jackson.serialization.write-dates-as-timestamps=false
